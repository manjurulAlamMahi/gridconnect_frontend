<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary Meta Tags -->
  <title>GridConnect – Connect Racing Drivers and Teams</title>
  <meta name="title" content="GridConnect – Connect Racing Drivers and Teams" />
  <meta name="description"
    content="GridConnect is a comprehensive platform designed to bridge the gap between racing drivers and teams. It provides role-based dashboards, real-time communication, and discovery tools for the racing community." />
  <meta name="keywords"
    content="racing drivers, racing teams, find drivers, find teams, racing community, racing stats, racing jobs, driver-team networking" />
  <meta name="author" content="GridConnect" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#ffffff" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/Logo.svg" />
  <link rel="apple-touch-icon" href="/Logo.svg" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.gridconnect.app/" />
  <meta property="og:title" content="GridConnect – Connect Racing Drivers and Teams" />
  <meta property="og:description"
    content="GridConnect is a comprehensive platform designed to bridge the gap between racing drivers and teams." />
  <meta property="og:image" content="https://www.gridconnect.app/Logo.svg" />
  <meta property="og:site_name" content="GridConnect" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://www.gridconnect.app/" />
  <meta name="twitter:title" content="GridConnect – Connect Racing Drivers and Teams" />
  <meta name="twitter:description"
    content="GridConnect is a comprehensive platform designed to bridge the gap between racing drivers and teams." />
  <meta name="twitter:image" content="https://www.gridconnect.app/Logo.svg" />

  <!-- Canonical -->
  <link rel="canonical" href="https://www.gridconnect.app/" />

  <!-- Structured Data – Organization -->
  <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "GridConnect",
        "url": "https://www.gridconnect.app/",
        "logo": "https://www.gridconnect.app/Logo.svg",
        "description": "GridConnect is a comprehensive platform designed to bridge the gap between racing drivers and teams.",
        "sameAs": []
      }
    </script>

  <!-- Structured Data – WebSite (enables Sitelinks Search Box) -->
  <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "GridConnect",
        "url": "https://www.gridconnect.app/"
      }
    </script>

  <link rel="preconnect" href="https://admin.gridconnect.app" crossorigin />
  <link rel="dns-prefetch" href="https://admin.gridconnect.app" />
  <link rel="preload" as="image" href="/src/assets/images/hero.svg" />
  <link rel="preload" as="image" href="/assets/Icons/Logo.svg" fetchpriority="high">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
